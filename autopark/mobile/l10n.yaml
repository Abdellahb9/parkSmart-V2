# Flutter gen-l10n. French is the template: every key must exist in
# app_fr.arb, and a key missing from app_ar.arb fails the build
# (see untranslated-messages-file).
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/gen
nullable-getter: false
untranslated-messages-file: build/untranslated_messages.json
