name: autopark_mobile
description: AutoPark - Smart Parking App for Laayoune
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.27.0"  # Color.withValues(alpha:) requires 3.27+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^14.8.1
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  socket_io_client: ^3.0.2
  geolocator: ^13.0.2
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets: []
