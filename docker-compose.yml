# AutoPark — the whole platform on one machine.
#
#   cp .env.example .env        # then set JWT_SECRET and the seed passwords
#   docker compose up -d --build
#   docker compose --profile tools run --rm seed      # demo data (wipes the DB)
#
# Portal: http://localhost:8080  (API at http://localhost:8080/api)
# The mobile app can use http://<this machine's IP>:8080/api as API_URL.

name: autopark

x-api-image: &api-image
  image: autopark-api:local
  build: ./autopark/backend

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Not published: only the API talks to the database.

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/autopark
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # nginx sits in front: take the client address from X-Forwarded-For.
      TRUST_PROXY: "1"
      # The stack serves plain HTTP on localhost. Behind HTTPS, set 1.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-0}
      PAYMENT_PROVIDER: mock
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - api-storage:/app/storage
    # Not published: reached through the web container's /api proxy.

  web:
    build:
      context: .
      dockerfile: autopark/web/Dockerfile
    image: autopark-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # ── One-off tasks ─────────────────────────────────────────────────────
  # docker compose --profile tools run --rm migrate
  migrate:
    <<: *api-image
    profiles: [tools]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/autopark
    command: ["npm", "run", "migrate"]

  # docker compose --profile tools run --rm seed   (WIPES the database;
  # needs the four SEED_*_PASSWORD values in .env)
  seed:
    <<: *api-image
    profiles: [tools]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/autopark
      SEED_ALLOW_PRODUCTION: "1"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_TECH_PASSWORD: ${SEED_TECH_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    command: ["node", "seed.js"]

volumes:
  mongo-data:
  api-storage:
